name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run compile

      - run: npm test

      # Integration tests are skipped in CI because they require a local
      # Azure DevOps git checkout to drive auto-detection. Run them locally
      # via `npm run test:integration` (set ADO_MARKDOWN_TEST_WORKSPACE to
      # any ADO clone).

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: ado-markdown-vsix
          path: dist/ado-markdown.vsix
          if-no-files-found: error
